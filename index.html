<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>zidu.zip</title>
<meta property="og:title" content="zidu.zip">
<meta property="og:description" content="zidu — apps, film, photography & apparel. everything i make, one desktop.">
<meta property="og:image" content="https://www.dispos.zip/imgs/038_1.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="zidu.zip">
<meta name="twitter:description" content="zidu — apps, film, photography & apparel. everything i make, one desktop.">
<meta name="twitter:image" content="https://www.dispos.zip/imgs/038_1.jpg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100vw;height:100vh;height:100dvh;overflow:hidden;font-family:'MS Sans Serif','Microsoft Sans Serif',Tahoma,Geneva,sans-serif;font-size:12px;
    background:linear-gradient(180deg,#4b8ce0 0%,#78b0e8 42%,#8ec96a 42%,#5a9e3f 100%);cursor:default;-webkit-user-select:none;user-select:none;touch-action:none}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  /* desktop */
  #desktop{position:fixed;inset:0 0 42px 0;padding:22px;z-index:1}
  .icons{display:grid;grid-template-columns:repeat(2,96px);gap:10px 26px;width:220px}
  .ic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;cursor:default;border-radius:3px;-webkit-tap-highlight-color:transparent}
  .ic:hover{background:rgba(0,0,80,.35)}
  .ic .g{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.4))}
  .ic .g.sv img{width:48px;height:48px;border-radius:10px;box-shadow:1px 1px 3px rgba(0,0,0,.45)}
  .ic .l{color:#fff;font-size:12px;text-align:center;text-shadow:1px 1px 2px rgba(0,0,0,.9);font-weight:bold;line-height:14px}
  /* classic gray window */
  .win{position:fixed;z-index:10;background:#c0c0c0;border-top:2px solid #dfdfdf;border-left:2px solid #dfdfdf;border-right:2px solid #404040;border-bottom:2px solid #404040;box-shadow:2px 2px 12px rgba(0,0,0,.45);display:flex;flex-direction:column}
  .tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:4px 5px 4px 6px;display:flex;align-items:center;gap:6px;font-size:12.5px}
  .tb .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb .x{background:#c0c0c0;color:#000;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #404040;border-bottom:1px solid #404040;width:22px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;cursor:pointer}
  .tb .x:active{border-top:1px solid #404040;border-left:1px solid #404040;border-right:1px solid #fff;border-bottom:1px solid #fff}
  .menu{display:flex;gap:14px;padding:3px 8px;border-bottom:1px solid #808080;color:#000}
  .menu span{padding:0 2px}
  .menu span:hover{background:#000080;color:#fff}
  .addr{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid #808080}
  .addr .box{flex:1;background:#fff;border:1px solid #808080;border-right-color:#dfdfdf;border-bottom-color:#dfdfdf;padding:2px 6px;font-size:12px}
  .wbody{background:#fff;margin:3px;border:1px solid #808080;border-right-color:#dfdfdf;border-bottom-color:#dfdfdf;padding:16px 14px}
  .hi{font-size:20px;font-weight:bold;color:#000080;margin-bottom:2px}
  .sub{color:#444;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .card{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px;border-radius:4px;cursor:pointer}
  .card:hover{background:#eef2ff;outline:1px dotted #98a}
  .card .th{width:88px;height:88px;border:1px solid #999;background:#eee;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;position:relative}
  .card .th img{width:100%;height:100%;object-fit:cover}
  .card .th.blue{background:#0b3d91;color:#fff}
  .card .th.black{background:#111;color:#fff}
  .card .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);color:#fff;font-size:26px}
  .card .t{font-weight:bold;font-size:12.5px;color:#000}
  .card .d{color:#666;font-size:11px;text-align:center;line-height:13px}
  .status{border-top:1px solid #808080;margin:0 3px 3px;padding:3px 8px;color:#333;background:#c0c0c0}
  /* about window body */
  .about{background:#fff;margin:3px;border:1px solid #808080;border-right-color:#dfdfdf;border-bottom-color:#dfdfdf;padding:16px 15px;width:400px;max-width:82vw;color:#222;font-size:12.5px;line-height:1.65}
  .about b{color:#000080}
  .about .row{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .lnk{color:#00c;text-decoration:none;border:1px solid #808080;border-top-color:#dfdfdf;border-left-color:#dfdfdf;background:#c0c0c0;padding:3px 12px;font-size:12px;cursor:pointer;color:#000}
  .lnk:active{border-top:1px solid #404040;border-left:1px solid #404040;border-right:1px solid #fff;border-bottom:1px solid #fff}
  /* taskbar */
  #taskbar{position:fixed;left:0;right:0;bottom:0;height:42px;z-index:9998;background:linear-gradient(180deg,#3a93f0,#215dc6);display:flex;align-items:center;padding:3px}
  #start{background:linear-gradient(180deg,#5eb85e,#3c9a3c);color:#fff;font-weight:bold;font-style:italic;font-size:15px;padding:4px 18px 5px 10px;border-radius:0 9px 9px 0;display:flex;align-items:center;gap:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);cursor:pointer;text-shadow:1px 1px 1px rgba(0,0,0,.35)}
  #start .flag{display:grid;grid-template-columns:6px 6px;grid-template-rows:6px 6px;gap:1px}
  #start .flag i{display:block;border-radius:1px}
  .tasks{flex:1;display:flex;gap:4px;padding:0 6px;overflow:hidden}
  .tk{background:#2f7fe0;color:#fff;padding:4px 12px;border:1px solid rgba(255,255,255,.4);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;font-weight:bold;cursor:pointer}
  .tk.active{background:#1e5cc0;box-shadow:inset 1px 1px 3px rgba(0,0,0,.4)}
  .tray{background:rgba(0,0,60,.25);color:#fff;padding:0 12px;height:34px;display:flex;align-items:center;gap:8px;border-left:1px solid rgba(255,255,255,.3);font-size:11.5px}
  /* start menu */
  #startmenu{position:fixed;left:2px;bottom:42px;width:230px;z-index:10000;display:none;background:#c0c0c0;border-top:2px solid #dfdfdf;border-left:2px solid #dfdfdf;border-right:2px solid #404040;box-shadow:2px 2px 12px rgba(0,0,0,.5)}
  #startmenu.open{display:block}
  .smhead{background:linear-gradient(0deg,#000080,#1084d0);color:#fff;font-weight:bold;font-size:15px;padding:10px 10px;display:flex;align-items:center;gap:8px;writing-mode:initial}
  .smhead .av{width:30px;height:30px;background:#fff;color:#000080;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold;border:1px solid #808080}
  .smitems{padding:4px 3px}
  .smi{padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#000;cursor:pointer}
  .smi:hover{background:#000080;color:#fff}
  .smsep{height:1px;background:#808080;border-bottom:1px solid #fff;margin:4px 6px}
  .smsub{display:none}
  .smsub.open{display:block}
  .smsub .smi{padding-left:30px;font-size:12px}
  @media (max-width:680px){
    .icons{grid-template-columns:repeat(2,80px);width:180px;gap:8px 14px}
    .grid{grid-template-columns:repeat(2,1fr)}
    .win{max-width:96vw}
    .about{width:auto}
  }
</style>
</head>
<body>

<div id="desktop"><div class="icons" id="icons"></div></div>

<div id="startmenu">
  <div class="smhead"><span class="av">z</span><span>zidu</span></div>
  <div class="smitems">
    <div class="smi" onclick="openWin('work')">🗂️ &nbsp;My Work</div>
    <div class="smi" onclick="openWin('about')">📄 &nbsp;about me</div>
    <div class="smsep"></div>
    <div class="smi" onclick="go('https://joinairr.com')">✈️ &nbsp;airr</div>
    <div class="smi" onclick="go('https://vids.zip')">🎬 &nbsp;vids.zip</div>
    <div class="smi" onclick="go('https://dispos.zip')">📷 &nbsp;dispos.zip</div>
    <div class="smi" onclick="go('https://tripleheartts.com')">👕 &nbsp;triple hearts</div>
    <div class="smi" onclick="go('https://scrapbook.zip')">📖 &nbsp;scrapbook.zip</div>
    <div class="smsep"></div>
    <div class="smi" onclick="toggleSub()">📸 &nbsp;Socials &nbsp;▸</div>
    <div class="smsub" id="smsub">
      <div class="smi" onclick="go('https://instagram.com/ziduflicks')">@ziduflicks</div>
      <div class="smi" onclick="go('https://instagram.com/zidudispos')">@zidudispos</div>
    </div>
    <div class="smsep"></div>
    <div class="smi">🔌 &nbsp;Shut Down...</div>
  </div>
</div>

<div id="taskbar">
  <div id="start" onclick="toggleStart(event)">
    <span class="flag"><i style="background:#f14e3b"></i><i style="background:#57c24a"></i><i style="background:#2f8ef0"></i><i style="background:#ffcb2e"></i></span>zidu.zip
  </div>
  <div class="tasks" id="tasks"></div>
  <div class="tray">🔊 <span id="clock"></span></div>
</div>

<script>
// ---- data ----
var PROJECTS = [
  { title:'airr',          url:'https://joinairr.com',       desc:'flight-deal app<br>joinairr.com',      th:'<div class="th"><img src="airr.png" alt="airr"></div>' },
  { title:'vids.zip',      url:'https://vids.zip',           desc:'videography<br>ziduflicks',            th:'<div class="th"><img src="https://www.dispos.zip/imgs/047_1.jpg" alt=""><div class="play">▶</div></div>' },
  { title:'dispos.zip',    url:'https://dispos.zip',         desc:'disposable photos<br>zidudispos',      th:'<div class="th"><img src="https://www.dispos.zip/imgs/038_1.jpg" alt=""></div>' },
  { title:'triple hearts', url:'https://tripleheartts.com',  desc:'clothing<br>store link →',             th:'<div class="th"><img src="triplehearts.jpg" alt="triple hearts"></div>' }
];
var DESK_ICONS = [
  {img:'airr.png', label:'airr',     act:"go('https://joinairr.com')"},
  {icon:'🎬', label:'vids.zip',      act:"go('https://vids.zip')"},
  {icon:'📷', label:'dispos.zip',    act:"go('https://dispos.zip')"},
  {img:'triplehearts.jpg', label:'triple hearts', act:"go('https://tripleheartts.com')"},
  {icon:'📖', label:'scrapbook.zip', act:"go('https://scrapbook.zip')"},
  {icon:'📄', label:'about me',      act:"openWin('about')"}
];
// ---- desktop icons ----
(function(){
  var html='';
  DESK_ICONS.forEach(function(ic){
    var glyph = ic.img ? '<img src="'+ic.img+'" alt="">' : ic.icon;
    html+='<div class="ic" ondblclick="'+ic.act+'" ontouchend="event.preventDefault();'+ic.act+'">'+
      '<div class="g'+(ic.img?' sv':'')+'">'+glyph+'</div><div class="l">'+ic.label+'</div></div>';
  });
  document.getElementById('icons').innerHTML=html;
})();
// ---- windows ----
var Z=20, openW={}, activeW=null;
function go(url){ closeStart(); window.open(url,'_blank','noopener'); }
function centerXY(w,h){
  var vw=window.innerWidth, vh=window.innerHeight;
  var minX = vw>760 ? 258 : 8;
  var x = Math.max(minX, Math.round((vw-w)/2));
  x = Math.min(x, Math.max(8, vw-w-8));
  var y = Math.max(12, Math.round((vh-40-h)/2)-10);
  return {x:x,y:y};
}
function workHTML(){
  var cards='';
  PROJECTS.forEach(function(p){
    cards+='<div class="card" onclick="go(\''+p.url+'\')">'+p.th+'<div class="t">'+p.title+'</div><div class="d">'+p.desc+'</div></div>';
  });
  return '<div class="menu"><span>File</span><span>Edit</span><span>View</span><span>Help</span></div>'+
    '<div class="addr"><span>Address</span><div class="box">C:\\zidu\\portfolio</div></div>'+
    '<div class="wbody"><div class="hi">hey, i\'m zidu 👋</div>'+
    '<div class="sub">developer · videographer · photographer · founder. everything i make lives here.</div>'+
    '<div class="grid">'+cards+'</div></div>'+
    '<div class="status">4 object(s) · click to open</div>';
}
function aboutHTML(){
  return '<div class="about">i\'m <b>zidu</b> (zidane), based in atlanta. i make a bunch of things:<br><br>'+
    '• <b>airr</b>: an app that finds you cheap flights fast<br>'+
    '• <b>vids.zip</b>: my videography (ziduflicks)<br>'+
    '• <b>dispos.zip</b>: disposable-camera photography (zidudispos)<br>'+
    '• <b>triple hearts</b>: my clothing brand<br><br>'+
    'poke around the desktop, or reach me below.'+
    '<div class="row">'+
    '<a class="lnk" onclick="go(\'https://instagram.com/ziduflicks\')">@ziduflicks</a>'+
    '<a class="lnk" onclick="go(\'https://instagram.com/zidudispos\')">@zidudispos</a>'+
    '<a class="lnk" href="mailto:zidufr@icloud.com">email</a>'+
    '</div></div>';
}
var WINS={
  work:{ title:'🗂️ &nbsp;zidu — My Work', body:workHTML, w:640, tk:'🗂️ zidu — My Work' },
  about:{ title:'📄 &nbsp;about me', body:aboutHTML, w:434, tk:'📄 about me' }
};
function openWin(id){
  closeStart();
  var wid='win-'+id;
  if(openW[wid]){ front(wid); return; }
  var cfg=WINS[id]; var w=Math.min(cfg.w, window.innerWidth-14);
  var el=document.createElement('div'); el.className='win'; el.id=wid; el.style.width=w+'px'; el.style.zIndex=(++Z);
  el.innerHTML='<div class="tb" data-drag><span class="ti">'+cfg.title+'</span><div class="x" onclick="closeWin(\''+wid+'\')" ontouchend="event.preventDefault();closeWin(\''+wid+'\')">✕</div></div>'+cfg.body();
  el.style.left='-9999px'; el.style.top='-9999px';
  document.body.appendChild(el);
  requestAnimationFrame(function(){ var pos=centerXY(el.offsetWidth||w, el.offsetHeight||320); el.style.left=pos.x+'px'; el.style.top=pos.y+'px'; });
  el.addEventListener('mousedown',function(){front(wid);});
  openW[wid]={tk:cfg.tk}; front(wid); makeDrag(el);
}
function closeWin(wid){ var el=document.getElementById(wid); if(el) el.remove(); delete openW[wid]; renderTasks(); }
function front(wid){ var el=document.getElementById(wid); if(el) el.style.zIndex=(++Z); activeW=wid; renderTasks(); }
function renderTasks(){
  var t=document.getElementById('tasks'), html='';
  for(var id in openW){ html+='<div class="tk'+(id===activeW?' active':'')+'" onclick="front(\''+id+'\')">'+openW[id].tk+'</div>'; }
  t.innerHTML=html;
}
// drag
function makeDrag(el){
  var bar=el.querySelector('[data-drag]'), st=null;
  function down(cx,cy){ front(el.id); var r=el.getBoundingClientRect(); st={ox:cx-r.left,oy:cy-r.top}; }
  bar.addEventListener('mousedown',function(e){ if(e.target.closest('.x'))return; down(e.clientX,e.clientY); e.preventDefault(); });
  bar.addEventListener('touchstart',function(e){ if(e.target.closest('.x'))return; var t=e.touches[0]; if(t)down(t.clientX,t.clientY); },{passive:true});
  document.addEventListener('mousemove',function(e){ if(!st)return; move(e.clientX,e.clientY); });
  document.addEventListener('touchmove',function(e){ if(!st)return; var t=e.touches[0]; if(t){move(t.clientX,t.clientY); e.preventDefault();} },{passive:false});
  document.addEventListener('mouseup',function(){st=null;});
  document.addEventListener('touchend',function(){st=null;});
  function move(cx,cy){ var x=cx-st.ox, y=cy-st.oy; y=Math.max(-2,Math.min(y,window.innerHeight-70)); x=Math.max(-el.offsetWidth+70,Math.min(x,window.innerWidth-60)); el.style.left=x+'px'; el.style.top=y+'px'; }
}
// start menu
var startOpen=false;
function toggleStart(e){ if(e)e.stopPropagation(); startOpen=!startOpen; document.getElementById('startmenu').classList.toggle('open',startOpen); if(!startOpen)closeSub(); }
function closeStart(){ startOpen=false; document.getElementById('startmenu').classList.remove('open'); closeSub(); }
function toggleSub(){ document.getElementById('smsub').classList.toggle('open'); }
function closeSub(){ document.getElementById('smsub').classList.remove('open'); }
document.addEventListener('mousedown',function(e){ if(!e.target.closest('#startmenu')&&!e.target.closest('#start')) closeStart(); });
// clock
function clock(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}); }
clock(); setInterval(clock,20000);
// open My Work on load
openWin('work');
</script>
</body>
</html>
