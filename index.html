<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>zidu.zip</title>
<meta property="og:title" content="zidu.zip">
<meta property="og:description" content="zidu — apps, film, photography & apparel. everything i make, one desktop.">
<meta property="og:image" content="https://www.dispos.zip/imgs/038_1.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="zidu.zip">
<meta name="twitter:description" content="zidu — apps, film, photography & apparel. everything i make, one desktop.">
<meta name="twitter:image" content="https://www.dispos.zip/imgs/038_1.jpg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100vw;height:100vh;height:100dvh;overflow:hidden;font-family:'MS Sans Serif','Microsoft Sans Serif',Tahoma,Geneva,sans-serif;font-size:12px;
    background:linear-gradient(180deg,#245edb 0%,#4b8ce0 34%,#78b0e8 45%,#6fb15a 45%,#4c8f3a 100%);cursor:default;-webkit-user-select:none;user-select:none;touch-action:none}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  /* desktop icons */
  #desktop{position:fixed;inset:0 0 40px 0;z-index:1}
  .icon{position:absolute;width:88px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 4px;border-radius:3px;cursor:default;-webkit-tap-highlight-color:transparent}
  .icon:hover{background:rgba(0,0,90,.28)}
  .icon .g{width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:33px;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.45))}
  .icon .g.sv svg{width:50px;height:50px;filter:drop-shadow(1px 1px 2px rgba(0,0,0,.45))}
  .icon .l{color:#fff;font-size:12px;font-weight:bold;text-align:center;line-height:14px;text-shadow:1px 1px 2px rgba(0,0,0,.9)}
  /* window */
  .win{position:fixed;z-index:10;background:#ece9d8;border:1px solid #0831d9;border-radius:8px 8px 0 0;box-shadow:3px 3px 18px rgba(0,0,0,.5);display:flex;flex-direction:column;min-width:280px}
  .tbar{background:linear-gradient(180deg,#0058ee 0,#3d90f6 8%,#0054e6 40%,#0054e6 88%,#4ba0ff 100%);color:#fff;font-weight:bold;padding:4px 5px 4px 8px;display:flex;align-items:center;gap:7px;border-radius:7px 7px 0 0;font-size:13px;text-shadow:1px 1px 1px rgba(0,0,0,.35)}
  .tbar .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbar .cx{width:21px;height:21px;border-radius:4px;background:linear-gradient(180deg,#f16d5c,#c23a26);border:1px solid #fff;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .wc{background:#ece9d8;padding:16px 16px 18px;border:2px solid #0831d9;border-top:none;border-radius:0 0 8px 8px}
  /* my work */
  .hi{font-size:22px;font-weight:bold;color:#0b3d91;margin-bottom:3px}
  .sub{color:#444;margin-bottom:18px;font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:440px;max-width:78vw}
  .pc{display:flex;gap:11px;align-items:center;padding:9px;background:#fff;border:1px solid #b9b9a8;border-radius:6px;cursor:pointer;transition:.12s}
  .pc:hover{border-color:#3a6ea5;background:#f2f7ff;transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.12)}
  .pc .th{width:64px;height:64px;flex-shrink:0;border-radius:5px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:#111}
  .pc .th img{width:100%;height:100%;object-fit:cover}
  .pc .th .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;background:rgba(0,0,0,.25)}
  .pc .tx .t{font-weight:bold;font-size:14px;color:#111}
  .pc .tx .d{color:#666;font-size:11.5px;line-height:14px;margin-top:2px}
  .pc .tx .u{color:#1a4fd0;font-size:11px;margin-top:3px}
  /* boarding pass mini */
  .pass{width:64px;height:64px;background:#0b3d91;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff}
  .pass .rt{font-weight:bold;font-size:12px;letter-spacing:.5px}
  .pass .pr{font-size:9px;color:#8fd0ff;margin-top:2px}
  .pass .bc{margin-top:4px;width:44px;height:9px;background:repeating-linear-gradient(90deg,#fff 0 1.5px,#0b3d91 1.5px 3px)}
  .hearts{width:64px;height:64px;background:linear-gradient(135deg,#111,#3a1620);color:#ff5a7a;display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:1px}
  /* about */
  .about{width:400px;max-width:80vw;color:#222;font-size:13px;line-height:1.6}
  .about b{color:#0b3d91}
  .about .row{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
  .lnk{color:#1a4fd0;text-decoration:none;border:1px solid #c3c3b0;background:#fff;border-radius:5px;padding:4px 10px;font-size:12px;cursor:pointer}
  .lnk:hover{background:#f2f7ff;border-color:#3a6ea5}
  /* taskbar */
  #taskbar{position:fixed;left:0;right:0;bottom:0;height:40px;z-index:9998;background:linear-gradient(180deg,#3168d5 0,#4993e6 9%,#2b74d6 18%,#2b74d6 92%,#1e5bc6 100%);display:flex;align-items:center;padding:0 4px 0 0;box-shadow:0 -1px 0 #1042a0 inset}
  #start{height:100%;padding:0 22px 3px 10px;background:linear-gradient(180deg,#78d95a 0,#54b13a 45%,#3f9a2e 55%,#2f7f22 100%);color:#fff;font-style:italic;font-weight:bold;font-size:16px;display:flex;align-items:center;gap:8px;border-radius:0 12px 12px 0;text-shadow:1px 1px 1px rgba(0,0,0,.4);cursor:pointer;box-shadow:inset 0 2px 1px rgba(255,255,255,.4)}
  #start .flag{display:grid;grid-template-columns:7px 7px;grid-template-rows:7px 7px;gap:1.5px;transform:rotate(0)}
  #start .flag i{display:block;border-radius:1px}
  .tasks{flex:1;display:flex;gap:4px;padding:0 8px;height:100%;align-items:center;overflow:hidden}
  .tk{background:linear-gradient(180deg,#3f8ae8,#2b6fd0);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:3px;padding:5px 12px;font-weight:bold;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center;cursor:pointer}
  .tray{background:linear-gradient(180deg,#1699e6,#0d87d8);color:#fff;height:100%;display:flex;align-items:center;gap:8px;padding:0 12px;border-left:1px solid rgba(255,255,255,.35);font-size:11.5px}
  /* start menu */
  #startmenu{position:fixed;left:0;bottom:40px;width:260px;z-index:10000;display:none;background:#fff;border:1px solid #0831d9;border-bottom:none;border-radius:8px 8px 0 0;box-shadow:3px -3px 16px rgba(0,0,0,.4);overflow:hidden}
  #startmenu.open{display:block}
  .smhead{background:linear-gradient(180deg,#1868e8,#0a4bd6);color:#fff;font-weight:bold;font-size:15px;padding:12px 12px;display:flex;align-items:center;gap:9px;text-shadow:1px 1px 1px rgba(0,0,0,.4)}
  .smhead .av{width:34px;height:34px;border-radius:6px;background:#fff;color:#0a4bd6;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
  .smitems{padding:6px 0}
  .smi{padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#111;cursor:pointer}
  .smi:hover{background:#2b74d6;color:#fff}
  .smsep{height:1px;background:#d3d3c0;margin:4px 10px}
  .smsub{display:none}
  .smsub.open{display:block}
  .smsub .smi{padding-left:34px;font-size:12px}
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;width:min(88vw,360px)}
    .win{max-width:96vw}
    #start{font-size:15px}
  }
</style>
</head>
<body>

<div id="desktop"></div>

<div id="startmenu">
  <div class="smhead"><span class="av">z</span><span>zidu</span></div>
  <div class="smitems">
    <div class="smi" onclick="openWin('work')">🗂️ &nbsp;My Work</div>
    <div class="smi" onclick="openWin('about')">📄 &nbsp;About Me</div>
    <div class="smsep"></div>
    <div class="smi" onclick="go('https://joinairr.com')">✈️ &nbsp;Airr</div>
    <div class="smi" onclick="go('https://vids.zip')">🎬 &nbsp;vids.zip</div>
    <div class="smi" onclick="go('https://dispos.zip')">📷 &nbsp;dispos.zip</div>
    <div class="smi" onclick="go('https://tripleheartts.shop')">👕 &nbsp;Triple Hearts</div>
    <div class="smi" onclick="go('https://scrapbook.zip')">📖 &nbsp;scrapbook.zip</div>
    <div class="smsep"></div>
    <div class="smi" onclick="toggleSub()">📸 &nbsp;Socials &nbsp;▸</div>
    <div class="smsub" id="smsub">
      <div class="smi" onclick="go('https://instagram.com/ziduflicks')">@ziduflicks</div>
      <div class="smi" onclick="go('https://instagram.com/zidudispos')">@zidudispos</div>
    </div>
    <div class="smsep"></div>
    <div class="smi">🔌 &nbsp;Shut Down...</div>
  </div>
</div>

<div id="taskbar">
  <div id="start" onclick="toggleStart(event)">
    <span class="flag"><i style="background:#f14e3b"></i><i style="background:#57c24a"></i><i style="background:#2f8ef0"></i><i style="background:#ffcb2e"></i></span>zidu.zip
  </div>
  <div class="tasks" id="tasks"></div>
  <div class="tray">🔊 <span id="clock"></span></div>
</div>

<script>
// ---- data ----
var PROJECTS = [
  { id:'airr',   label:'Airr',           icon:'✈️', url:'https://joinairr.com',        title:'Airr',           desc:'flight-deal app. find cheap flights fast.', u:'joinairr.com',      th:'pass' },
  { id:'vids',   label:'vids.zip',       icon:'🎬', url:'https://vids.zip',            title:'vids.zip',       desc:'videography reel. ziduflicks.',             u:'vids.zip',          th:'video' },
  { id:'dispos', label:'dispos.zip',     icon:'📷', url:'https://dispos.zip',          title:'dispos.zip',     desc:'disposable-camera photos. zidudispos.',     u:'dispos.zip',        th:'photo' },
  { id:'triple', label:'Triple Hearts',  icon:'👕', url:'https://tripleheartts.shop',  title:'Triple Hearts',  desc:'clothing brand.',                           u:'tripleheartts.shop',th:'hearts' }
];
var DESK_ICONS = [
  {icon:'✈️', label:'Airr',          act:"go('https://joinairr.com')"},
  {icon:'🎬', label:'vids.zip',      act:"go('https://vids.zip')"},
  {icon:'📷', label:'dispos.zip',    act:"go('https://dispos.zip')"},
  {icon:'👕', label:'Triple Hearts', act:"go('https://tripleheartts.shop')"},
  {icon:'📖', label:'scrapbook.zip', act:"go('https://scrapbook.zip')"},
  {icon:'🗂️', label:'My Work',       act:"openWin('work')"},
  {icon:'📄', label:'About Me',      act:"openWin('about')"}
];
function thumb(p){
  if(p.th==='pass') return '<div class="pass"><div class="rt">ATL→NYC</div><div class="pr">$38 nonstop</div><div class="bc"></div></div>';
  if(p.th==='video') return '<img src="https://www.dispos.zip/imgs/047_1.jpg" alt=""><div class="pl">▶</div>';
  if(p.th==='photo') return '<img src="https://www.dispos.zip/imgs/038_1.jpg" alt="">';
  if(p.th==='hearts') return '<div class="hearts">♡♡♡</div>';
  return '';
}
// ---- desktop icons ----
(function(){
  var d=document.getElementById('desktop'), html='';
  DESK_ICONS.forEach(function(ic,i){
    var top=18+i*88, left=18;
    html+='<div class="icon" style="left:'+left+'px;top:'+top+'px" ondblclick="'+ic.act+'" ontouchend="event.preventDefault();'+ic.act+'">'+
      '<div class="g">'+ic.icon+'</div><div class="l">'+ic.label+'</div></div>';
  });
  d.innerHTML=html;
})();
// ---- windows ----
var Z=20, openW={};
function go(url){ closeStart(); window.open(url,'_blank','noopener'); }
function centerXY(w,h){ var vw=window.innerWidth, vh=window.innerHeight; var x=Math.round((vw-w)/2); var minX=vw>680?128:8; x=Math.max(minX,Math.min(x,vw-w-8)); var y=Math.max(10,Math.round((vh-40-h)/2)); return {x:x,y:y}; }
function workHTML(){
  var cards='';
  PROJECTS.forEach(function(p){
    cards+='<div class="pc" onclick="go(\''+p.url+'\')"><div class="th">'+thumb(p)+'</div>'+
      '<div class="tx"><div class="t">'+p.title+'</div><div class="d">'+p.desc+'</div><div class="u">'+p.u+' ↗</div></div></div>';
  });
  return '<div class="hi">hey, i\'m zidu 👋</div><div class="sub">i build apps, shoot video &amp; photo, and run a clothing brand. it all lives here. click in.</div><div class="grid">'+cards+'</div>';
}
function aboutHTML(){
  return '<div class="about">i\'m <b>zidu</b> (zidane), based in atlanta. i make a bunch of things:<br><br>'+
    '• <b>Airr</b>: an app that finds you cheap flights fast<br>'+
    '• <b>vids.zip</b>: my videography (ziduflicks)<br>'+
    '• <b>dispos.zip</b>: disposable-camera photography (zidudispos)<br>'+
    '• <b>Triple Hearts</b>: my clothing brand<br><br>'+
    'poke around the desktop, or reach me below.'+
    '<div class="row">'+
    '<a class="lnk" onclick="go(\'https://instagram.com/ziduflicks\')">@ziduflicks</a>'+
    '<a class="lnk" onclick="go(\'https://instagram.com/zidudispos\')">@zidudispos</a>'+
    '<a class="lnk" href="mailto:zidufr@icloud.com">email</a>'+
    '</div></div>';
}
var WINS={
  work:{ title:'🗂️ zidu — My Work', body:workHTML, w:480 },
  about:{ title:'📄 About Me', body:aboutHTML, w:432 }
};
function openWin(id){
  closeStart();
  var wid='win-'+id;
  if(openW[wid]){ front(wid); return; }
  var cfg=WINS[id]; var w=Math.min(cfg.w, window.innerWidth-16);
  var el=document.createElement('div'); el.className='win'; el.id=wid; el.style.width=w+'px'; el.style.zIndex=(++Z);
  el.innerHTML='<div class="tbar" data-drag><span class="ti">'+cfg.title+'</span><div class="cx" onclick="closeWin(\''+wid+'\')" ontouchend="event.preventDefault();closeWin(\''+wid+'\')">✕</div></div><div class="wc">'+cfg.body()+'</div>';
  el.style.left='-9999px'; el.style.top='-9999px';
  document.body.appendChild(el);
  requestAnimationFrame(function(){ var pos=centerXY(el.offsetWidth||w, el.offsetHeight||300); el.style.left=pos.x+'px'; el.style.top=pos.y+'px'; });
  el.addEventListener('mousedown',function(){front(wid);});
  openW[wid]={title:cfg.title}; front(wid); renderTasks();
  makeDrag(el);
}
function closeWin(wid){ var el=document.getElementById(wid); if(el) el.remove(); delete openW[wid]; renderTasks(); }
function front(wid){ var el=document.getElementById(wid); if(el) el.style.zIndex=(++Z); activeW=wid; renderTasks(); }
var activeW=null;
function renderTasks(){
  var t=document.getElementById('tasks'), html='';
  for(var id in openW){ var short=openW[id].title; html+='<div class="tk'+(id===activeW?' active':'')+'" onclick="front(\''+id+'\')">'+short+'</div>'; }
  t.innerHTML=html;
}
// drag
function makeDrag(el){
  var bar=el.querySelector('[data-drag]'), st=null;
  function down(cx,cy){ front(el.id); var r=el.getBoundingClientRect(); st={ox:cx-r.left,oy:cy-r.top}; }
  bar.addEventListener('mousedown',function(e){ if(e.target.closest('.cx'))return; down(e.clientX,e.clientY); e.preventDefault(); });
  bar.addEventListener('touchstart',function(e){ if(e.target.closest('.cx'))return; var t=e.touches[0]; if(t)down(t.clientX,t.clientY); },{passive:true});
  document.addEventListener('mousemove',function(e){ if(!st)return; move(e.clientX,e.clientY); });
  document.addEventListener('touchmove',function(e){ if(!st)return; var t=e.touches[0]; if(t){move(t.clientX,t.clientY); e.preventDefault();} },{passive:false});
  document.addEventListener('mouseup',function(){st=null;});
  document.addEventListener('touchend',function(){st=null;});
  function move(cx,cy){ var x=cx-st.ox, y=cy-st.oy; y=Math.max(-4,Math.min(y,window.innerHeight-70)); x=Math.max(-el.offsetWidth+70,Math.min(x,window.innerWidth-60)); el.style.left=x+'px'; el.style.top=y+'px'; }
}
// start menu
var startOpen=false;
function toggleStart(e){ if(e)e.stopPropagation(); startOpen=!startOpen; document.getElementById('startmenu').classList.toggle('open',startOpen); if(!startOpen)closeSub(); }
function closeStart(){ startOpen=false; document.getElementById('startmenu').classList.remove('open'); closeSub(); }
function toggleSub(){ document.getElementById('smsub').classList.toggle('open'); }
function closeSub(){ document.getElementById('smsub').classList.remove('open'); }
document.addEventListener('mousedown',function(e){ if(!e.target.closest('#startmenu')&&!e.target.closest('#start')) closeStart(); });
// clock
function clock(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}); }
clock(); setInterval(clock,20000);
// open My Work on load
openWin('work');
</script>
</body>
</html>
